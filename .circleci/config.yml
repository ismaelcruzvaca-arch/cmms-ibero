version: 2.1

commands:
  install-deps:
    steps:
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package-lock.json" }}
            - v1-deps-
      - run:
          name: Install dependencies
          command: npm ci --legacy-peer-deps
      - save_cache:
          key: v1-deps-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

  setup-env:
    steps:
      - run:
          name: Create .env for E2E
          command: |
            echo "VITE_SUPABASE_URL=$SUPABASE_URL" >> .env
            echo "VITE_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
            echo "VITE_TEST_EMAIL=$VITE_TEST_EMAIL" >> .env
            echo "VITE_TEST_PASSWORD=$VITE_TEST_PASSWORD" >> .env

jobs:
  test:
    docker:
      - image: cimg/node:22.22
    resource_class: small
    steps:
      - checkout
      - install-deps
      - run:
          name: Unit tests
          command: npm test
      - run:
          name: Coverage
          command: npm run test:coverage
          when: always
      - store_artifacts:
          path: coverage

  lint:
    docker:
      - image: cimg/node:22.22
    resource_class: small
    steps:
      - checkout
      - install-deps
      - run:
          name: Lint
          command: npm run lint
          when: always

  build:
    docker:
      - image: cimg/node:22.22
    resource_class: small
    steps:
      - checkout
      - install-deps
      - run:
          name: Build
          command: npm run build

  e2e:
    docker:
      - image: cimg/node:22.22
    resource_class: medium
    steps:
      - checkout
      - install-deps
      - setup-env
      - run:
          name: Install Playwright browsers
          command: npx playwright install --with-deps chromium
      - run:
          name: E2E tests
          command: npm run test:e2e
      - store_artifacts:
          path: test-results
          when: always

  mutation:
    docker:
      - image: cimg/node:22.22
    resource_class: medium
    steps:
      - checkout
      - install-deps
      - run:
          name: Mutation tests
          command: npm run test:mutation

  deploy-vercel:
    docker:
      - image: cimg/node:22.22
    resource_class: small
    steps:
      - checkout
      - install-deps
      - run:
          name: Deploy to Vercel
          command: npx vercel --prod --token=$VERCEL_TOKEN --yes

workflows:
  ci-branch:
    jobs:
      - lint
      - test
      - build:
          requires:
            - lint
            - test

  ci-main:
    when:
      equal: [main, << pipeline.git.branch >>]
    jobs:
      - lint
      - test
      - build:
          requires:
            - lint
            - test
      - e2e:
          requires:
            - test
      - mutation:
          requires:
            - test
      - deploy-vercel:
          requires:
            - build
