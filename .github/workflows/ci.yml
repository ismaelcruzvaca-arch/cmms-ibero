name: CI

# ⚠️ TEMPORARILY DISABLED while CircleCI is configured
# Re-enable when ready: uncomment push below and remove workflow_dispatch
on:
  workflow_dispatch:
  # push:
  #   branches-ignore: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
